#!/bin/bash
# guardian.conf - Gateway Guardian 配置文件

# ============================================================
# 检测参数
# ============================================================

# 检测间隔 (秒)
CHECK_INTERVAL=60

# HTTP 检测超时 (秒)
HTTP_TIMEOUT=10

# 等待 Gateway 启动时间 (秒)
GATEWAY_STARTUP_WAIT=15

# ============================================================
# 重试策略
# ============================================================

# 最大重试次数 - 连续失败次数达到此值则介入
MAX_RETRIES=3

# 冷却期 (秒) - 恢复后等待时间
COOLDOWN_PERIOD=90

# ============================================================
# 回滚策略
# ============================================================

# 启用自动回滚
ENABLE_ROLLBACK=true

# 回滚前备份
ROLLBACK_BACKUP=true

# ============================================================
# 备份策略
# ============================================================

# 本地备份目录
LOCAL_BACKUP_DIR="$HOME/gateway-guardian-backups/gateway-config"

# 保留备份数量
MAX_BACKUPS=10

# 启用远程备份 (GitHub)
ENABLE_REMOTE_BACKUP=false

# 远程仓库地址 (配置后启用)
REMOTE_REPO=""

# 加密密钥文件路径 (请自定义)
ENCRYPTION_KEY_FILE="$HOME/.guardian-key"

# ============================================================
# 安全配置
# ============================================================

# 敏感字段列表 (备份时脱敏)
SENSITIVE_FIELDS=("token" "password" "apiKey" "secret" "credential")

# 审计日志
AUDIT_LOG="$HOME/gateway-guardian/logs/audit.log"

# ============================================================
# 通知配置
# ============================================================

# Discord 频道 ID (请替换为你的频道ID)
DISCORD_CHANNEL_ID="YOUR_DISCORD_CHANNEL_ID"

# 通知级别: all, error, critical
NOTIFY_LEVEL="error"

# ============================================================
# 端口配置
# ============================================================

# Gateway 端口
GATEWAY_PORT=18789

# 启用 Discord 通知
ENABLE_DISCORD_NOTIFY=true

# 通知最小间隔 (秒)
NOTIFY_MIN_INTERVAL=60
