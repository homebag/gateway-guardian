#!/bin/bash
# guardian.conf - Guardian v3.2 配置文件

# ============================================================
# 检测参数
# ============================================================

CHECK_INTERVAL=60
HTTP_TIMEOUT=10
GATEWAY_STARTUP_WAIT=15

# ============================================================
# 重试策略
# ============================================================

MAX_RETRIES=3
COOLDOWN_PERIOD=90

# ============================================================
# 回滚策略
# ============================================================

ENABLE_ROLLBACK=true
ROLLBACK_BACKUP=true

# ============================================================
# 备份策略
# ============================================================

LOCAL_BACKUP_DIR="$HOME/.openclaw/backups/gateway-config"
MAX_BACKUPS=10
ENABLE_REMOTE_BACKUP=false

# ============================================================
# 通知配置
# ============================================================

DISCORD_CHANNEL_ID="1471899227927089325"
NOTIFY_LEVEL="error"
ENABLE_DISCORD_NOTIFY=true
NOTIFY_MIN_INTERVAL=60
GATEWAY_PORT=18789
